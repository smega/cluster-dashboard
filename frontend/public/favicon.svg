<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .bg2 { fill: none; stroke: #1e293b; stroke-width: 6; }
      .cloudFill { fill: rgba(255,255,255,0.10); }
      .cloudStroke { fill: none; stroke: rgba(255,255,255,0.90); stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
      .link { stroke: #38bdf8; stroke-width: 12; stroke-linecap: round; }
      .nodeOuter { fill: #0f172a; stroke: #38bdf8; stroke-width: 8; }
      .nodeInner { fill: #38bdf8; }
    </style>
  </defs>

  <!-- Rounded square background -->
  <rect x="30" y="30" width="452" height="452" rx="92" class="bg"/>
  <rect x="40" y="40" width="432" height="432" rx="86" class="bg2"/>

  <!-- Cloud shape (approx) -->
  <g>
    <!-- fill by overlaying the same cloud silhouette -->
    <g opacity="0.12">
      <circle cx="201" cy="250" r="78" fill="#ffffff"/>
      <circle cx="256" cy="210" r="98" fill="#ffffff"/>
      <circle cx="316" cy="250" r="78" fill="#ffffff"/>
      <rect x="165" y="250" width="182" height="88" rx="36" fill="#ffffff"/>
    </g>

    <!-- stroke -->
    <circle cx="201" cy="250" r="78" class="cloudStroke"/>
    <circle cx="256" cy="210" r="98" class="cloudStroke"/>
    <circle cx="316" cy="250" r="78" class="cloudStroke"/>
    <rect x="165" y="250" width="182" height="88" rx="36" class="cloudStroke"/>
  </g>

  <!-- Network links -->
  <line x1="200" y1="278" x2="256" y2="240" class="link"/>
  <line x1="256" y1="240" x2="318" y2="278" class="link"/>
  <line x1="200" y1="278" x2="318" y2="278" class="link"/>

  <!-- Nodes -->
  <g>
    <circle cx="200" cy="278" r="20" class="nodeOuter"/>
    <circle cx="200" cy="278" r="7" class="nodeInner"/>
    <circle cx="318" cy="278" r="20" class="nodeOuter"/>
    <circle cx="318" cy="278" r="7" class="nodeInner"/>
    <circle cx="256" cy="240" r="20" class="nodeOuter"/>
    <circle cx="256" cy="240" r="7" class="nodeInner"/>
  </g>
</svg>
